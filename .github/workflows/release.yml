name: Release

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: npm-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Verify release metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          assert.equal(pkg.name, "dsh-yaml-include");
          assert.equal(pkg.private, undefined);
          assert.equal(process.env.RELEASE_TAG, `v${pkg.version}`);
          assert.equal(process.env.RELEASE_PRERELEASE, "false");
          assert.match(pkg.version, /^\d+\.\d+\.\d+$/);
          NODE
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26.8.2
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
          no-cache: true
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run check
      - run: pnpm run check:quality
      - run: pnpm run smoke
      - run: npm pack --dry-run --ignore-scripts
      - name: Pack verified sources
        run: pnpm --config.ignore-scripts=true pack --out "$RUNNER_TEMP/package.tgz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      id-token: write # Short-lived OIDC avoids storing an npm token.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: package
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26.8.2
          package-manager-cache: false
      - name: Publish exactly one tarball
        run: |
          shopt -s nullglob
          packages=(./package/*.tgz)
          test "${#packages[@]}" -eq 1
          npm publish "${packages[0]}" --registry https://registry.npmjs.org --provenance --access public --tag latest --ignore-scripts
